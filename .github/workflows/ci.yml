name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://exemplo.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: chave-de-teste
      VITE_MAPBOX_TOKEN: pk.teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
